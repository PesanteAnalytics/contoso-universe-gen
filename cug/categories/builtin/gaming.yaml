      fr: Consoles de Jeux
      de: Spielkonsolen
      zh: 游戏机
      ja: ゲーム機
      ar: أجهزة ألعاب
    brands: [Sony, Microsoft, Nintendo]
    price_range: [299, 599]
    margin_range: [0.02, 0.08]   # Hardware margin is thin
