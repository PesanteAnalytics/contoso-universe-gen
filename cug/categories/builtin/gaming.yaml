  de: Spiele und Spielzeug
  zh: 游戏和玩具
  ja: ゲームとおもちゃ
  ar: ألعاب وألعاب أطفال

subcategories:

  - id: consoles
    display_names:
      en: Game Consoles
      es: Consolas de Videojuegos
