      2022: 1.20
      2023: 0.95
      2024: 0.80
      2025: 0.75
      2026: 0.70
    products:
      - name_template: "{brand} {model}"
        models: [PlayStation 5, Xbox Series X, Nintendo Switch, Xbox Series S,
                 PlayStation 5 Digital, Nintendo Switch OLED]
        specs: []
        brands: []

  - id: video_games
    display_names:
      en: Video Games
      es: Videojuegos
      pt: Videogames
      fr: Jeux Vidéo
      de: Videospiele
      zh: 电子游戏
      ja: テレビゲーム
      ar: ألعاب الفيديو
    brands: [Activision, EA, Ubisoft, Nintendo, Sony, 2K, Bethesda]
    price_range: [19, 79]
    margin_range: [0.30, 0.55]   # Software margin is great
    trend:
      2018: 0.85
      2019: 0.90
      2020: 1.90   # Lockdown gaming explosion
      2021: 1.65
      2022: 1.15
      2023: 0.90
      2024: 0.78
      2025: 0.72
      2026: 0.70
    products:
      - name_template: "{brand} {model}"
        models: [Action RPG, Sports Simulator, First Person Shooter, Strategy,
