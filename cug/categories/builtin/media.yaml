      2018: 1.15
      2019: 1.08
      2020: 0.40   # Streaming killed physical music but COVID lockdown
      2021: 0.50
      2022: 0.55
      2023: 0.50
      2024: 0.45
      2025: 0.42
      2026: 0.40
    products:
      - name_template: "{model} — {brand}"
        models: [CD Album, Vinyl Record, Box Set, Collector's Edition, Live Album]
        specs: []
        brands: []

  - id: movies_physical
    display_names:
      en: Movies and TV Shows (Physical)
      es: Películas y Series (Físico)
      pt: Filmes e Séries (Físico)
      fr: Films et Séries TV (Physique)
      de: Filme und Serien (Physisch)
      zh: 电影和电视节目（实体）
      ja: 映画とTVシリーズ（物理メディア）
      ar: الأفلام والمسلسلات (فيزيائي)
    brands: [Disney, Universal, Warner Bros, Paramount, Sony Pictures, A24]
    price_range: [9, 69]
    margin_range: [0.30, 0.55]
    trend:
      2018: 1.20
      2019: 1.10
      2020: 1.55   # Streaming surge but also physical disc buying
