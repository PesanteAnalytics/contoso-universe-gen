# ─────────────────────────────────────────────────────────────────────────────
# SM Contoso — 1M-line retail star schema for the veda-xray-dev-fabric models
#
#   Window : 2023-01-01 → today (three full closed years + the current YTD)
#   Grain  : one row per order line; ~2.6 lines per order
#   Base   : 120k registered customers, 30% of them active, cut into four tiers
#
# Regenerate with:
#   cug generate -c configs/sm_contoso_1M.toml --verify
# ─────────────────────────────────────────────────────────────────────────────

[general]
start_date  = "2023-01-01"
end_date    = "2026-09-04"
language    = "en"
country     = "US"
seed        = 42
chunk_days  = 30

[output]
output_path      = "D:/PAL-TEMPORAL-REPORSITORIOS/veda-xray-dev-fabric/06-Fabric-Models/SM Contoso/data"
formats          = ["parquet"]
target_orders    = 273_000        # calibrated: growth + basket factors land this on ~1.00M lines
compress         = true
integrity_check  = true
integrity_strict = true

[output.format_options]
parquet_compression = "zstd"

[customers]
pool_size           = 120_000
active_pct          = 0.30
online_pct_start    = 0.28        # 2023 already had a mature online channel
online_pct_end      = 0.47
avg_lines_per_order = 2.6
max_lines_per_order = 12

# Four tiers over the active base. Shares must add to 1.0.
[[customers.segments]]
name                = "Key Account"
share               = 0.01
demand_weight       = 60.0
lines_multiplier    = 2.2
quantity_multiplier = 1.8

[[customers.segments]]
name                = "Large"
share               = 0.04
demand_weight       = 18.0
lines_multiplier    = 1.6
quantity_multiplier = 1.35

[[customers.segments]]
name                = "Medium"
share               = 0.15
demand_weight       = 5.0
lines_multiplier    = 1.2
quantity_multiplier = 1.1

[[customers.segments]]
name                = "Small"
share               = 0.80
demand_weight       = 1.0
lines_multiplier    = 1.0
quantity_multiplier = 1.0

[categories]
enabled      = ["electronics", "home", "gaming", "media", "fashion"]
custom_paths = []

# ─── Annual recurring sales events ───────────────────────────────────────────
[[events.annual]]
name   = "Black Friday"
month  = 11
day    = 25
factor = 2.8

[[events.annual]]
name   = "Cyber Monday"
month  = 11
day    = 28
factor = 2.5

[[events.annual]]
name   = "Christmas"
month  = 12
day    = 25
factor = 2.0

[[events.annual]]
name   = "Back to School"
month  = 8
day    = 15
factor = 1.8

[[events.annual]]
name   = "Prime Day"
month  = 7
day    = 12
factor = 2.5

# ─── One-time events inside the 2023-2026 window ─────────────────────────────
# COVID and the 2022 inflation squeeze fall before start_date, so they are gone.
[[events.one_time]]
name       = "AI & Electronics Boom"
date_start = "2023-06-01"
date_end   = "2024-12-31"
factor     = 1.09   # AI/tech spending recovery, laptop and device refresh cycle

[[events.one_time]]
name       = "Rate-Cut Consumer Rebound"
date_start = "2025-03-01"
date_end   = "2025-12-31"
factor     = 1.05   # easing cycle feeding back into discretionary retail

[[events.one_time]]
name       = "Tariff Cost Pass-Through"
date_start = "2026-02-01"
date_end   = "2026-06-30"
factor     = 0.94   # import-cost pass-through compressing unit volumes

# ─── Weekday sales factors (Mon=0 … Sun=6) ───────────────────────────────────
[weekday_factors]
factors = [0.75, 0.85, 0.95, 1.05, 1.20, 1.60, 0.30]
