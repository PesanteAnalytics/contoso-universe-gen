# Configuración en español — nombres, ciudades y categorías en ES (10M Orders)
# OPTIMIZADO: pool_size reducido para máxima velocidad de generación
[general]
start_date   = "2018-01-01"
end_date     = "2026-12-31"
language     = "es"
country      = "MX"
seed         = 42
chunk_days   = 90

[output]
output_path    = "./output"
formats        = ["parquet"]   # Solo parquet — mucho más rápido que CSV a 10M filas
target_orders  = 10_000_000
compress       = true

[customers]
pool_size  = 100_000   # 100K clientes es suficiente para 10M órdenes
active_pct = 0.70
online_pct_start = 0.04
online_pct_end   = 0.30

[categories]
enabled = ["electronics", "home", "gaming", "media"]

# ─── Annual recurring sales events ───────────────────────────────────────────
[[events.annual]]
name   = "Black Friday"
month  = 11
day    = 25
factor = 2.8

[[events.annual]]
name   = "Cyber Monday"
month  = 11
day    = 28
factor = 2.5

[[events.annual]]
name   = "Christmas"
month  = 12
day    = 25
factor = 2.0

[[events.annual]]
name   = "Back to School"
month  = 8
day    = 15
factor = 1.8

[[events.annual]]
name   = "Prime Day"
month  = 7
day    = 12
factor = 2.5

# ─── One-time historical events ───────────────────────────────────────────────
[[events.one_time]]
name       = "COVID Lockdown Drop"
date_start = "2020-03-15"
date_end   = "2020-04-30"
factor     = 0.45

[[events.one_time]]
name       = "COVID eCommerce Surge"
date_start = "2020-05-01"
date_end   = "2021-03-31"
factor     = 1.18

[[events.one_time]]
name       = "Post-COVID Recovery"
date_start = "2021-04-01"
date_end   = "2022-06-30"
factor     = 1.06

[[events.one_time]]
name       = "Inflation Pressure 2022"
date_start = "2022-01-01"
date_end   = "2022-12-31"
factor     = 0.92

[[events.one_time]]
name       = "AI & Electronics Boom 2023-2024"
date_start = "2023-06-01"
date_end   = "2024-12-31"
factor     = 1.09

# ─── Weekday sales factors (Mon=0 … Sun=6) ────────────────────────────────────
[weekday_factors]
factors = [0.75, 0.85, 0.95, 1.05, 1.20, 1.60, 0.30]
