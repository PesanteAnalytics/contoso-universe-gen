# ─────────────────────────────────────────────────────────────────────────────
# Contoso Universe Generator — Session Configuration
# Generated from CUG-CONFIG.md on 2026-03-11
# ─────────────────────────────────────────────────────────────────────────────

[general]
start_date  = "2022-01-01"
end_date    = "2026-03-17"
language    = "en"
country     = "US"
seed        = 42
chunk_days  = 30

[output]
output_path    = "./output"
formats        = ["csv"]
target_orders  = 100
compress       = true

[output.format_options]
# Parquet
parquet_compression     = "zstd"
# parquet_row_group_size = auto

# CSV
csv_separator           = ","
csv_include_header      = true
csv_null_value          = ""
# csv_date_format       = auto

# DuckDB
duckdb_db_name          = "contoso.duckdb"

# Delta Lake
delta_mode              = "overwrite"
delta_name              = "contoso"

# JSON
json_row_oriented       = false
json_pretty             = false

# Excel
excel_single_workbook   = true
excel_workbook_name     = "contoso.xlsx"

[customers]
pool_size         = 50000
active_pct        = 0.30
online_pct_start  = 0.05
online_pct_end    = 0.55

[categories]
enabled      = ["electronics", "home", "gaming", "media"]
custom_paths = []

