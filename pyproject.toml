[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contoso-universe-gen"
version = "0.3.0"
description = "High-performance synthetic retail data generator — Polars + DuckDB + NumPy + i18n"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
authors = [
    {name = "Pesante Analytics LLC"}
]
keywords = ["data-generator", "synthetic-data", "polars", "duckdb", "retail", "power-bi", "contoso"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Database",
]

dependencies = [
    # Core DataFrame engine — vectorized, fast, lazy evaluation
    "polars>=0.20.0",
    # Vectorized RNG and array ops behind the customer generator
    "numpy>=1.26.0",
    # Embedded analytical SQL engine
    "duckdb>=0.10.0",
    # Config validation with type-safe schemas
    "pydantic>=2.6.0",
    # CLI framework — type-hint based, autocomplete
    "typer>=0.12.0",
    # Beautiful terminal UI — progress bars, tables, colors
    "rich>=13.7.0",
    # YAML parsing for category plugins
    "pyyaml>=6.0.1",
    # Parquet + Arrow backend (used by Polars internally)
    "pyarrow>=15.0.0",
    # Holidays by country for DimDate calendar
    "holidays>=0.46",
]

# The three heavier writers are extras, not core. `pyodbc` needs an ODBC stack
# and a compiler on some platforms, so shipping it as a hard requirement means a
# failed `pip install` for the many people who only ever want Parquet. Every one
# of these is imported lazily, inside the writer that needs it, and raises a
# message naming the extra when it is missing.
[project.optional-dependencies]
delta = ["deltalake>=0.17.0"]        # Delta Lake output for Fabric / Databricks
excel = ["xlsxwriter>=3.1.0"]        # .xlsx workbooks
sqlserver = ["pyodbc>=5.0.0"]        # SQL Server output over ODBC
all = [
    "deltalake>=0.17.0",
    "xlsxwriter>=3.1.0",
    "pyodbc>=5.0.0",
]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.16.4",   # CI pins 0.16.4 — keep the floor in step with it
    "mypy>=1.9.0",
    # The suite exercises every writer, so dev carries the format extras too.
    "deltalake>=0.17.0",
    "xlsxwriter>=3.1.0",
    "pyodbc>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/PesanteAnalytics/contoso-universe-gen"
Repository = "https://github.com/PesanteAnalytics/contoso-universe-gen"
Issues = "https://github.com/PesanteAnalytics/contoso-universe-gen/issues"
Changelog = "https://github.com/PesanteAnalytics/contoso-universe-gen/releases"

[project.scripts]
cug = "cug.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["cug"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# cug/cli.py reconfigures stdout and stderr to UTF-8 before anything else runs.
# On Windows the default console codec is cp1252, which cannot encode the
# box-drawing characters Rich prints. The shim has to execute above the imports,
# and the import sorter would move it back down if it were an import itself.
"cug/cli.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
